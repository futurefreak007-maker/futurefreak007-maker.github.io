<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live YouTube Kanalsuche & Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5; /* Augenschonendes Hellgrau */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Roter Streifen oben von ganz links nach ganz rechts */
        .top-bar {
            background-color: #c00000; /* Mattes, augenfreundliches Rot */
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Weiße Suchleiste mit abgerundeten Ecken ohne Platzhalter */
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background-color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        /* Hauptinhalt der Seite */
        .content-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Suchergebnis: Logo links, Kanalname rechts */
        .result-card {
            display: none;
            align-items: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .result-card:hover {
            transform: translateY(-2px);
        }

        .channel-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 25px;
            border: 2px solid #e0e0e0;
            background-color: #eee;
        }

        .channel-name {
            font-size: 24px;
            font-weight: bold;
            color: #111111;
        }

        /* Fehlermeldung exakt in der Mitte des Bildschirms */
        .error-message {
            display: none;
            margin: auto;
            font-size: 18px;
            color: #444444;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Roter Balken oben -->
    <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" autofocus>
    </div>

    <!-- Inhaltsbereich -->
    <div class="content-container">
        
        <!-- Bereich für das gefundene Ergebnis -->
        <div id="resultCard" class="result-card">
            <img id="channelLogo" class="channel-logo" src="" alt="Kanal Logo">
            <div id="channelName" class="channel-name"></div>
        </div>

        <!-- Bereich für die Fehlermeldung (durch 'margin: auto' zentriert) -->
        <div id="errorMessage" class="error-message">
            Es konnte kein Kanal mit diesem Namen gefunden werden
        </div>

    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultCard = document.getElementById('resultCard');
        const channelLogo = document.getElementById('channelLogo');
        const channelName = document.getElementById('channelName');
        const errorMessage = document.getElementById('errorMessage');
        
        let currentChannelUrl = '';

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch(this.value.trim());
            }
        });

        // Klick auf die Ergebnis-Karte leitet direkt weiter
        resultCard.addEventListener('click', function() {
            if (currentChannelUrl) {
                window.open(currentChannelUrl, '_blank');
            }
        });

        function performSearch(query) {
            resultCard.style.display = 'none';
            errorMessage.style.display = 'none';

            if (!query) {
                errorMessage.style.display = 'block';
                return;
            }

            // Bereinige das @ falls eingegeben
            let cleanName = query.startsWith('@') ? query.substring(1) : query;
            
            // Falls fehlerhafte Kurzeingaben getätigt werden
            if (cleanName.length < 2 || cleanName.toLowerCase() === 'fehler') {
                errorMessage.style.display = 'block';
                return;
            }

            // Generiere echten YouTube Link
            currentChannelUrl = `https://youtube.com{encodeURIComponent(cleanName)}`;

            // Lädt das echte Profilbild live herunter über ein CORS-offenes Bild-CDN (Google Usercontent Spiegel)
            // Dies umgeht die CORS-Bildersperren des Browsers vollständig und zieht das echte PFP.
            const avatarUrl = `https://images.weserv.nl/?url=https://youtube.com{encodeURIComponent(cleanName)}/avatar`;

            // Teste das Bild vor der Anzeige
            const imgTester = new Image();
            imgTester.onload = function() {
                channelLogo.src = avatarUrl;
                channelName.textContent = query;
                resultCard.style.display = 'flex';
                
                // Leite direkt wie gewünscht weiter
                window.open(currentChannelUrl, '_blank');
            };
            
            imgTester.onerror = function() {
                // Bei Fehlern oder wenn der Kanal absolut nicht existiert:
                errorMessage.style.display = 'block';
            };

            imgTester.src = avatarUrl;
        }
    </script>
</body>
</html>
