<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Kanal Suche</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background-color: #cc1818;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background-color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        .content-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .result-card {
            display: none;
            align-items: center;
            margin-top: 20px;
            background: transparent;
        }

        .channel-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 20px;
            background-color: #ddd;
        }

        .channel-name {
            font-size: 24px;
            font-weight: bold;
            color: #111111;
        }

        .error-message {
            display: none;
            margin: auto;
            font-size: 18px;
            color: #333333;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" autofocus>
    </div>

    <div class="content-container">
        <div id="resultCard" class="result-card">
            <img id="channelLogo" class="channel-logo" src="" alt="Kanal Logo">
            <div id="channelName" class="channel-name"></div>
        </div>

        <div id="errorMessage" class="error-message">
            Es konnte kein Kanal mit diesem Namen gefunden werden
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultCard = document.getElementById('resultCard');
        const channelLogo = document.getElementById('channelLogo');
        const channelName = document.getElementById('channelName');
        const errorMessage = document.getElementById('errorMessage');

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch(this.value.trim());
            }
        });

        async function performSearch(query) {
            resultCard.style.display = 'none';
            errorMessage.style.display = 'none';

            if (!query) return;

            // Bereinigen des Inputs (@ entfernen, falls vorhanden)
            let cleanQuery = query.replace('@', '');

            // Liste stabiler CORS proxies für Fallbacks
            const proxies = [
                (q) => `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/oembed?url=https://www.youtube.com/@' + q + '&format=json')}`,
                (q) => `https://corsproxy.io/?${encodeURIComponent('https://www.youtube.com/oembed?url=https://www.youtube.com/@' + q + '&format=json')}`
            ];

            let success = false;

            for (let i = 0; i < proxies.length; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000); // 6 Sekunden Timeout per Proxy

                    const response = await fetch(proxies[i](cleanQuery), { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (!response.ok) continue;

                    let data;
                    if (i === 0) {
                        // allorigins wrapper
                        const json = await response.json();
                        if (!json.contents) continue;
                        data = JSON.parse(json.contents);
                    } else {
                        // corsproxy.io liefert direkt JSON
                        data = await response.json();
                    }

                    if (data && data.author_name) {
                        // Da oembed kein direktes Profilbild liefert, nutzen wir ein stabiles und augenschonendes Standard-Avatar-Design
                        // Das verhindert zudem CORS-Fehler beim Laden fremder Bilder in lokalen Dateien
                        channelLogo.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.author_name)}&background=cc1818&color=fff&rounded=true&size=128`;
                        channelName.textContent = data.author_name;
                        resultCard.style.display = 'flex';
                        success = true;
                        break; // Erfolgreich abgebildet, Schleife verlassen
                    }
                } catch (err) {
                    console.log(`Proxy ${i} fehlgeschlagen:`, err);
                }
            }

            if (!success) {
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
